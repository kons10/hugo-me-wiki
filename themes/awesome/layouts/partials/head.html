<head>
  <meta charset="UTF-8">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="stylesheet" href="{{ "css/base.css" | relURL }}" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ "css/dark.css" | relURL }}" crossorigin="anonymous">
  <link rel="stylesheet" media="(prefers-color-scheme: light)" href="{{ "css/light.css" | relURL }}" crossorigin="anonymous">
  <link rel="preload" href="/js/mwc.js" as="script" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script type="module">
    import * as Turbo from 'https://cdn.jsdelivr.net/npm/@hotwired/turbo@8/dist/turbo.es2017-esm.js'
  </script>
  <script src="/js/mwc.js" crossorigin="anonymous" defer></script>
  <script src="https://esm.sh/gh/kons10/Nizi-Counter/main.js" type="module" defer></script>

  <!-- 坚持开放安卓系统 -->
  <script src="https://keepandroidopen.org/banner.js?lang=ja&size=minimal&animation=off&id=my-banner" defer></script>
  
  <!-- Google翻訳 遅延ロード -->
  <script>
    function initGoogleTranslate() {
      window.googleTranslateElementInit = function() {
        new google.translate.TranslateElement({
          pageLanguage: 'ja',
          includedLanguages: 'zh-TW,zh-CN,en,ko,hi,th',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        }, 'google_translate_element');
      };
      let script = document.createElement('script');
      script.src = '//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
      document.head.appendChild(script);
    }
    
    document.addEventListener('turbo:load', initGoogleTranslate);
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initGoogleTranslate);
    } else {
      initGoogleTranslate();
    }
  </script>
  {{ partial "material-symbols.html" . }}
</head>
