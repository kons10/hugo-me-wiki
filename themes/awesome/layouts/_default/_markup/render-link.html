{{- /* layouts/_default/_markup/render-link.html */ -}}
{{- $isLinksPage := eq .Page.File.Path "links.md" -}}

{{- if $isLinksPage -}}
  {{- /* links.md用：buttonコンポーネントとして出力 */ -}}
  <style>
    :root {
      --md-outlined-button-container-shape: 0px;
      --md-outlined-button-label-text-font: system-ui;
    }
  </style>
  <md-outlined-button href="{{ .Destination }}" {{ with .Title }}title="{{ . }}"{{ end }}>
    {{ .Text | safeHTML }}
  </md-outlined-button>
{{- else -}}
  {{- /* それ以外のページは通常のaタグ */ -}}
  <a href="{{ .Destination }}" class="container" {{ with .Title }}title="{{ . }}"{{ end }}>
    {{ .Text | safeHTML }}
    <md-focus-ring style="--md-focus-ring-shape:8px;"></md-focus-ring>
    <md-ripple></md-ripple>
  </a>
{{- end -}}
